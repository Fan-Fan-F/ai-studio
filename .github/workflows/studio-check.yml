name: studio-check
on:
  workflow_dispatch:
  schedule:
    - cron: '14 1 * * 1'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Environment report
        run: |
          echo "== AI Studio worker online =="
          date -u
          uname -a
          python3 --version
          df -h / | tail -1
          free -m | head -2
      - name: Write status artifact
        run: |
          mkdir -p out
          { echo "studio-check OK"; date -u; git --version; } > out/status.txt
      - name: Upload status
        uses: actions/upload-artifact@v4
        with:
          name: studio-status
          path: out/status.txt
